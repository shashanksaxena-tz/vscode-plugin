global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: 'batch-processor'
    static_configs:
      - targets: ['batch-processor:8080']
  - job_name: 'dashboard'
    metrics_path: /api/metrics
    static_configs:
      - targets: ['dashboard:3000']
