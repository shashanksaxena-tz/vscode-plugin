groups:
  - name: copilot_analytics
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(batch_job_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in batch processor"
          description: "Batch processor is experiencing errors."
