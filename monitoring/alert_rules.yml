groups:
  - name: copilot-analytics
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

      - alert: BatchJobErrorRateHigh
        expr: rate(batch_job_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High batch job error rate"
          description: "Batch job error rate is {{ $value }} errors/sec (sustained for 5m)."

      - alert: BatchJobDurationHigh
        expr: histogram_quantile(0.95, rate(batch_job_duration_seconds_bucket[5m])) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Batch job duration high"
          description: "95th percentile of batch job duration is {{ $value }} seconds (sustained for 5m)."
